{% extends "base.html" %}

{% block title %}Register | BloodConnect{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="container">

        <div class="auth-card">

            <div class="text-center mb-2">
                <div style="font-size: 48px;">🩸</div>
            </div>

            <h1>Create Account</h1>

            <p class="auth-description">
                Join BloodConnect and help save lives.
            </p>

            <!-- Registration Form -->

            <form id="registerForm"
                  action="{{ url_for('register') }}"
                  method="POST">

                <!-- Full Name -->

                <div class="form-group">

                    <label for="full_name">
                        Full Name *
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        class="form-control"
                        placeholder="Enter your full name"
                        minlength="2"
                        maxlength="100"
                        autocomplete="name"
                        required
                    >

                </div>

                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address *
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email address"
                        maxlength="150"
                        autocomplete="email"
                        required
                    >

                </div>

                <!-- Mobile Number -->

                <div class="form-group">

                    <label for="phone">
                        Mobile Number *
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        class="form-control"
                        placeholder="Enter 10-digit mobile number"
                        pattern="[0-9]{10}"
                        minlength="10"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="tel"
                        required
                    >

                    <small class="text-muted">
                        Enter a valid 10-digit mobile number.
                    </small>

                </div>

                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password *
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Create a password"
                        minlength="8"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >

                    <small class="text-muted">
                        Use at least 8 characters.
                    </small>

                </div>

                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password *
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        class="form-control"
                        placeholder="Re-enter your password"
                        minlength="8"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <!-- Submit Button -->

                <button
                    type="submit"
                    class="btn btn-primary btn-block"
                >
                    Create My Account
                </button>

            </form>

            <!-- Login Link -->

            <div class="form-footer">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Login Here
                </a>

            </div>

        </div>

    </div>

</section>

{% endblock %}
